<text x="125" y="478" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#14243b">08 / Preflight</text>
<text x="80" y="509" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Recheck originals and hashes</text>
<text x="80" y="532" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Validate timing / space / format</text>
<text x="80" y="555" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Block unsupported inputs</text>
