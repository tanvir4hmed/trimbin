<rect x="1230" y="710" width="6" height="150" rx="3" fill="#2563eb"/>
<use href="#disk" x="1247" y="728" width="34" height="34" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="1295" y="748" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#14243b">12 / Reopen + recover</text>
<text x="1250" y="779" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Saved revisions persist</text>
<text x="1250" y="802" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Leases / bounded job retry</text>
<text x="1250" y="825" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Backup and restore evidence</text>
<rect x="40" y="990" width="1520" height="72" rx="12" fill="#e3eaf4"/>
<text x="60" y="1012" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Every failure is a visible state; jobs cannot publish invalid partial evidence as success. Human edits survive re-analysis.</text>
<text x="60" y="1037" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Runtime checks used generated 1080p footage. Real-film quality, wider fidelity and actual Premiere import remain separate gates.</text>
