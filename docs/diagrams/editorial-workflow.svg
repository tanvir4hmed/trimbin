<text x="905" y="208" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#14243b">03 / Derive previews</text>
<text x="860" y="239" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Proxy • sprite • audio</text>
<text x="860" y="262" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Durable processing job</text>
<text x="860" y="285" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Keep originals immutable</text>
