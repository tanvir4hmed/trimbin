<text x="1295" y="478" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#14243b">05 / Human review</text>
<text x="1250" y="509" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Inspect source-linked evidence</text>
<text x="1250" y="532" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Correct uncertain observations</text>
<text x="1250" y="555" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Failed rerun retains prior head</text>
