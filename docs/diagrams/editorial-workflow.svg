<text x="470" y="509" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Order • trim • mute • gain</text>
<text x="470" y="532" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Frame-based canonical revision</text>
<text x="470" y="555" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Conflict + retry protection</text>
