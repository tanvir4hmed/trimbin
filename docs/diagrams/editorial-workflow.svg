<text x="515" y="208" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#14243b">02 / Register source</text>
<text x="470" y="239" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Source identity + SHA256</text>
<text x="470" y="262" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Project-scoped access</text>
<text x="470" y="285" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Probe timebase and color</text>
<rect x="840" y="174" width="310" height="150" rx="14" fill="#dbe3ef"/>
