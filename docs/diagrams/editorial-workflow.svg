<text x="470" y="779" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Decode originals, not proxies</text>
<text x="470" y="802" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Supported SDR H.264 / AAC</text>
<text x="470" y="825" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Never cut the source files</text>
