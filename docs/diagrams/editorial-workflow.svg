<text x="905" y="748" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#14243b">11 / Verify + download</text>
<text x="860" y="779" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Pinned snapshot / artifact hash</text>
<text x="860" y="802" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Format + frame checks</text>
<text x="860" y="825" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Scoped authenticated access</text>
