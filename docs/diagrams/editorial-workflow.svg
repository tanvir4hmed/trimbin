<text x="905" y="478" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#14243b">06 / Select ranges</text>
<text x="860" y="509" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Pin source/evidence versions</text>
<text x="860" y="532" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Exact allowed source intervals</text>
<text x="860" y="555" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">No fabricated missing footage</text>
