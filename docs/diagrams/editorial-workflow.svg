<text x="125" y="208" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#14243b">01 / Upload or mount</text>
<text x="80" y="239" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Resumable 8 MiB chunks</text>
<text x="80" y="262" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Allowed deployment roots</text>
<text x="80" y="285" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Browser-local paths need upload</text>
