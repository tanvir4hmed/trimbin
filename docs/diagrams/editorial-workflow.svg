<text x="125" y="748" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#14243b">09 / Editable handoff</text>
<text x="80" y="779" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Native JSON + FCP7 XML ZIP</text>
<text x="80" y="802" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Manifest + relink references</text>
<text x="80" y="825" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#52647a">Premiere acceptance pending</text>
