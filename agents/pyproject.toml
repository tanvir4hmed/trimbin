[project]
name = "trimbin-agents"
version = "0.1.0"
description = "Agent network for Trimbin — slate reading, comparative analysis, assembly, retrieval"
requires-python = ">=3.12,<3.14"

# What the code imports, and nothing else.
#
# This list previously carried google-adk, aiplatform, storage, firestore,
# pubsub, clickhouse-connect and an OpenTelemetry exporter. None of them was
# imported anywhere in the package. That is not free: the worker runs on a
# scale-to-zero service where image size is cold start latency, and a manifest
# that names libraries the code does not use stops describing the code.
#
# Storage and the database belong to the API and the worker, which have their
# own dependencies; agents receive bytes and return contracts. When a later
# phase genuinely needs one of these, it comes back as one line.
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # The MCP client. Every search reaches ClickHouse through the official
    # mcp-clickhouse server, which this speaks to over stdio.
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trimbin_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

# Never enforced until now: CI triggered on pull requests and on branches other
# than main, and everything here reaches production by a push to main. The
# workflow ran zero times, so this section is being written against 36 findings
# rather than none.
ignore = [
    # Exceptions named for what happened rather than for being exceptions:
    # NotReady, QueryFailed, ReaderMissing. `NotReadyError` reads worse and says
    # less. A convention, not a correctness rule.
    "N818",
    # `class FindingCode(str, Enum)` should be `StrEnum` — and ruff is right,
    # because this is the root cause of a real bug: from Python 3.11 a
    # `str, Enum` member stringifies to "FindingCode.CONTINUITY_BLOCKING", which
    # is how the archive filled with class names that matched no query and
    # scored every take as flawless. It is patched around in
    # decisions._code_value().
    #
    # Not fixed here. These enums are the pydantic response schema Vertex
    # validates against, and changing their runtime type is not a change to make
    # inside a phase whose purpose is to stop the system lying about itself.
    # Logged as G29 against P3, which opens these contracts anyway.
    "UP042",
]

# Tests build throwaway stand-ins. A mutable class attribute on a five-line fake
# is not the hazard this rule is for.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# Contracts are the boundary between agents, and this said so with
# `disallow_any_explicit = true` — a rule that produced 24 errors the first time
# mypy was ever allowed to run, every one of them on `model_config =
# ConfigDict(...)`.
#
# ConfigDict is a TypedDict whose values pydantic types as Any. The rule is not
# catching loose typing in our contracts; it is catching pydantic, and no amount
# of care here can satisfy it while the models are pydantic models.
#
# So the intention stays and the unenforceable clause goes. `strict = true`
# above already covers the contracts, which is what the comment was reaching
# for.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
