[project]
name = "trimbin-agents"
version = "0.1.0"
description = "Agent network for Trimbin — slate reading, comparative analysis, assembly, retrieval"
requires-python = ">=3.12,<3.14"

# What the code imports, and nothing else.
#
# This list previously carried google-adk, aiplatform, storage, firestore,
# pubsub, clickhouse-connect and an OpenTelemetry exporter. None of them was
# imported anywhere in the package. That is not free: the worker runs on a
# scale-to-zero service where image size is cold start latency, and a manifest
# that names libraries the code does not use stops describing the code.
#
# Storage and the database belong to the API and the worker, which have their
# own dependencies; agents receive bytes and return contracts. When a later
# phase genuinely needs one of these, it comes back as one line.
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # The MCP client. Every search reaches ClickHouse through the official
    # mcp-clickhouse server, which this speaks to over stdio.
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trimbin_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# Contracts are the boundary between agents. If they type-check loosely, the
# guarantee they exist to provide is worthless.
[[tool.mypy.overrides]]
module = "trimbin_agents.contracts.*"
disallow_any_explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
