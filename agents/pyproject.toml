[project]
name = "trimbin-agents"
version = "0.1.0"
description = "Agent network for Trimbin — slate reading, comparative analysis, assembly, retrieval"
requires-python = ">=3.12,<3.14"

dependencies = [
    # Google Cloud AI. These are the only AI libraries this project uses.
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-pubsub>=2.23.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "clickhouse-connect>=0.8.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trimbin_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# Contracts are the boundary between agents. If they type-check loosely, the
# guarantee they exist to provide is worthless.
[[tool.mypy.overrides]]
module = "trimbin_agents.contracts.*"
disallow_any_explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
