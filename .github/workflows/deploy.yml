# Push to main deploys. There is no other path to production.
#
# Authentication is Workload Identity Federation: GitHub proves which repository
# and which ref is running, Google issues a short-lived token. No service account
# key exists anywhere to leak, rotate, or find in a git history two years from
# now.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to request the OIDC token

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt an apply mid-flight

env:
  REGION: us-central1
  SERVICE: trimbin-api

jobs:
  # Nothing reaches production without the tests passing.
  #
  # This gate did not exist. CI ran only on branches other than main and only
  # ever ran the agents suite, so every deployment so far went out with no test
  # having gated it. Calling the workflow rather than repeating its steps means
  # there is one definition of "the checks".
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy to production
    needs: checks
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # -- infrastructure ---------------------------------------------------
      # Runs first: the image is pushed to a registry Terraform creates, and the
      # service reads secrets Terraform provisions.
      - name: Terraform init
        working-directory: infra/envs/demo
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=envs/demo"

      - name: Terraform apply
        working-directory: infra/envs/demo
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_clickhouse_org_id: ${{ secrets.CLICKHOUSE_ORG_ID }}
          TF_VAR_clickhouse_token_key: ${{ secrets.CLICKHOUSE_TOKEN_KEY }}
          TF_VAR_clickhouse_token_secret: ${{ secrets.CLICKHOUSE_TOKEN_SECRET }}
          # A client ID is public by design — it is in every page that
          # loads the sign-in button. It lives in secrets only because that
          # is where deployment configuration lives.
          TF_VAR_oauth_client_id: ${{ secrets.OAUTH_CLIENT_ID }}
        run: terraform apply -auto-approve

      - name: Read Terraform outputs
        id: tf
        working-directory: infra/envs/demo
        run: |
          echo "registry=$(terraform output -raw artifact_registry)" >> "$GITHUB_OUTPUT"
          echo "ch_host=$(terraform output -json clickhouse_endpoints | jq -r '.https.host')" >> "$GITHUB_OUTPUT"
          echo "ch_reader_secret=$(terraform output -raw clickhouse_reader_secret)" >> "$GITHUB_OUTPUT"

      # -- schema -----------------------------------------------------------
      # After the database exists, before anything deploys that reads from it.
      # Migrations are idempotent, so running on every push is the normal case.
      - name: ClickHouse migrations
        working-directory: clickhouse
        env:
          CLICKHOUSE_URL: https://${{ steps.tf.outputs.ch_host }}:8443
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: |
          # The read-only user's password comes from Secret Manager, where
          # Terraform generated it. Not a GitHub secret: nobody types this one,
          # and a credential that exists in two places is a credential that gets
          # rotated in one.
          CLICKHOUSE_READER_PASSWORD=$(gcloud secrets versions access latest             --secret="${{ steps.tf.outputs.ch_reader_secret }}" 2>/dev/null || true)
          export CLICKHOUSE_READER_PASSWORD

          chmod +x migrate.sh
          ./migrate.sh

      # -- application ------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Built from the repository root, not from api/. The image carries the
      # agents package as well, and a build context inside api/ cannot see it.
      - name: Build and push API
        run: |
          IMAGE="${{ steps.tf.outputs.registry }}/api"
          # Tagged with the commit as well as latest, so a bad deploy can be
          # rolled back to a specific build rather than a moving target.
          docker build -f api/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy API
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ steps.tf.outputs.registry }}/api:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --quiet

      # Same image as the API. The service overrides the command, so there is
      # nothing extra to build — only a second revision to point at the tag CI
      # just pushed.
      - name: Deploy ingest worker
        run: |
          gcloud run deploy trimbin-worker \
            --image="${{ steps.tf.outputs.registry }}/api:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --command=uvicorn \
            --args="app.worker.main:app,--host,0.0.0.0,--port,8080,--workers,1,--no-access-log" \
            --quiet

      - name: Build and push web
        working-directory: web
        run: |
          IMAGE="${{ steps.tf.outputs.registry }}/web"

          # Terraform generated the guest password; the sign-in form shows it,
          # so it has to reach the bundle at build time. Empty is survivable —
          # the form still works, it just does not fill itself in.
          GUEST_PASS=$(gcloud secrets versions access latest \
            --secret="trimbin-guest-pass" \
            --project="${{ secrets.GCP_PROJECT_ID }}" 2>/dev/null || echo "")

          if [ -z "$GUEST_PASS" ]; then
            echo "::warning::guest pass unreadable - the sign-in form will not fill itself in"
          else
            echo "guest pass read (${#GUEST_PASS} chars)"
          fi

          docker build \
            --build-arg NEXT_PUBLIC_OAUTH_CLIENT_ID="${{ secrets.OAUTH_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_TRIAL_PASS="$GUEST_PASS" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy web
        run: |
          gcloud run deploy trimbin-web \
            --image="${{ steps.tf.outputs.registry }}/web:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --quiet

      # -- proof ------------------------------------------------------------
      # A deploy that reports success while serving errors is worse than one
      # that fails, because nobody goes back to check.
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region="${{ env.REGION }}" --format='value(status.url)')

          echo "Deployed to $URL"

          # Liveness first — it touches nothing and should answer immediately.
          curl --fail --silent --show-error --max-time 30 "$URL/public/health"

          # Then a route that reads the database. Generous timeout: the service
          # idles to save credit and the first request after a quiet period pays
          # for waking it.
          curl --fail --silent --show-error --max-time 120 "$URL/public/accuracy" \
            | jq -e '.definition != null'

          # And the page a visitor actually lands on. An API that answers while
          # the site returns a 500 is a deploy that reports success and shows a
          # stranger an error.
          WEB=$(gcloud run services describe trimbin-web \
            --region="${{ env.REGION }}" --format='value(status.url)')

          echo "Web at $WEB"
          for page in / /about /guide /dashboard /projects /archive /accuracy /project/1; do
            echo "  $page"
            curl --fail --silent --show-error --max-time 120 "$WEB$page" > /dev/null
          done

          # Who the API thinks an anonymous caller is. The interface asks this
          # before drawing anything, so a route that 500s here leaves every
          # visitor looking at a page with no buttons and no explanation.
          curl --fail --silent --show-error --max-time 60 "$URL/me" \
            | jq -e '.role == "guest" and .can_read == true'

          # The scene assembly and its exports. Two different routes, and the
          # first version of this check confused them: /scenes/1 lists a
          # project's scenes, /scenes/1/<n> is the stringout for one of them.
          SCENE=$(curl --fail --silent --show-error --max-time 120 "$URL/scenes/1" \
            | jq -r '.scenes[0] // empty')

          if [ -n "$SCENE" ]; then
            echo "  stringout for scene $SCENE"
            curl --fail --silent --show-error --max-time 120 "$URL/scenes/1/$SCENE" \
              | jq -e 'has("entries")' > /dev/null

            # A stringout that answers and an EDL that does not is a scene an
            # editor can watch and cannot use.
            curl --fail --silent --show-error --max-time 120 \
              "$URL/scenes/1/$SCENE/edl" | head -1 | grep -q '^TITLE:'
            echo "  EDL export answers."
          else
            echo "  project 1 has no scenes to assemble; skipping the stringout check." >&2
          fi

          # The track requires ClickHouse to be reached through mcp-clickhouse at
          # runtime, and a missing dependency makes that fail silently — the
          # search still answers, from the direct client, with the reason in a
          # stack trace nobody reads. So ask, then check which path served it.
          echo "Checking the search reaches ClickHouse through MCP..."
          curl --fail --silent --show-error --max-time 240             -X POST "$URL/ask/1"             -H "Content-Type: application/json"             -d '{"question":"Which takes were rejected for continuity?"}'             > /dev/null

          sleep 10
          if gcloud logging read               'resource.labels.service_name="'"${{ env.SERVICE }}"'" AND textPayload:"via MCP"'               --project="${{ secrets.GCP_PROJECT_ID }}" --limit=1 --freshness=5m               --format="value(textPayload)" | grep -q "via MCP"; then
            echo "  search served through mcp-clickhouse."
          else
            echo "  search did NOT go through MCP — it fell back." >&2
            gcloud logging read               'resource.labels.service_name="'"${{ env.SERVICE }}"'" AND severity>=WARNING'               --project="${{ secrets.GCP_PROJECT_ID }}" --limit=3 --freshness=5m               --format="value(textPayload)" >&2
            exit 1
          fi

          echo "Smoke test passed."
