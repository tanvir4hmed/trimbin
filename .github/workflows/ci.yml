# Every check that can run without credentials.
#
# Runs on pull requests, on pushes to any branch including main, and — the part
# that matters — as a reusable workflow that deploy.yml calls before it deploys.
#
# It ran zero times before today. The triggers were `pull_request` and
# `push: branches-ignore: [main]`, and the only way anything reaches production
# here is a push to main, so no test has ever gated a deployment. The job was
# even named "Agents & API" while every step ran in `agents/`.

name: CI

on:
  pull_request:
  push:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    name: Agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --dev
        working-directory: agents

      - name: Lint
        run: uv run ruff check .
        working-directory: agents

      - name: Format check
        run: uv run ruff format --check .
        working-directory: agents

      - name: Types
        run: uv run mypy trimbin_agents
        working-directory: agents

      - name: Test
        run: uv run pytest -q
        working-directory: agents

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Resolves trimbin-agents through the path source in api/pyproject.toml.
      # Before that declaration existed this step was impossible, which is why
      # these tests only ever ran locally.
      - name: Install
        run: uv sync --all-extras --dev
        working-directory: api

      - name: Lint
        run: uv run ruff check .
        working-directory: api

      # The same two checks the agents job runs. They were absent here because
      # this job did not exist; matching them means one standard, not two.
      - name: Format check
        run: uv run ruff format --check .
        working-directory: api

      - name: Test
        run: uv run pytest -q
        working-directory: api

      # The committed TypeScript must match the schema the API actually
      # publishes. Without this the generation is a convention, and a convention
      # is what the hand-written client already was.
      - name: Types are current
        run: |
          cp web/lib/schema.d.ts /tmp/committed.d.ts
          bash tools/generate-types.sh
          if ! diff -q /tmp/committed.d.ts web/lib/schema.d.ts >/dev/null; then
            echo "::error::web/lib/schema.d.ts is stale - run tools/generate-types.sh"
            diff /tmp/committed.d.ts web/lib/schema.d.ts | head -40
            exit 1
          fi
          echo "generated types match the API schema"

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      # The frontend rules that are pure functions — the slug scheme, the
      # ingest resume fingerprint, which shot statuses still want a person —
      # are run here rather than asserted as source text from the API suite.
      - name: Tests
        run: npx vitest run
        working-directory: web

      - name: Types
        run: npx tsc --noEmit
        working-directory: web

      # The build is the check that matters. A page can typecheck and still fail
      # to prerender, and that failure only appears in deploy.
      - name: Build
        run: npx next build
        working-directory: web
        env:
          NEXT_PUBLIC_OAUTH_CLIENT_ID: ""
          NEXT_PUBLIC_TRIAL_PASS: ""

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Format
        run: terraform fmt -check -recursive
        working-directory: infra

      # Validation without a backend — this job holds no credentials by design.
      - name: Validate bootstrap
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/bootstrap

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
